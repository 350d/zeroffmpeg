name: Build FFmpeg for Pi Zero

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_option:
        description: 'Build option (minimal/normal/full)'
        required: true
        default: 'normal'
        options:
        - minimal
        - normal
        - full

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        option: [minimal, normal, full]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build FFmpeg (${{ matrix.option }})
      run: |
        docker build \
          --build-arg OPTION=${{ matrix.option }} \
          --output type=local,dest=./output \
          --target output \
          .
          
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.option }}-armv6
        path: |
          output/ffmpeg
          output/ffprobe
        retention-days: 30 