name: 🚀 Build FFmpeg with Hardware Acceleration for Raspberry Pi Zero

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      option:
        description: 'FFmpeg build option'
        required: true
        default: 'normal'
        type: choice
        options:
        - minimal
        - normal
        - full

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        option: 
          - ${{ github.event.inputs.option || 'normal' }}
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      
    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64
        
    - name: 🏗️ Build FFmpeg with Docker (${{ matrix.option }} configuration)
      run: |
        docker build \
          --build-arg OPTION=${{ matrix.option }} \
          --target output \
          --output type=local,dest=./output \
          .
        
    - name: 📤 Verify extracted binaries
      run: |
        # Make binaries executable
        chmod +x ./output/ffmpeg ./output/ffprobe
        
        # Show file info
        ls -lh ./output/ffmpeg ./output/ffprobe
        file ./output/ffmpeg ./output/ffprobe
        
    - name: 🧪 Test binary architecture (without execution)
      run: |
        # Test file format and architecture
        file ./output/ffmpeg
        file ./output/ffprobe
        
        # Check if binaries are ARM and statically linked
        if file ./output/ffmpeg | grep -q "ARM.*statically linked"; then
          echo "✅ FFmpeg: Correct ARM architecture and statically linked"
        else
          echo "❌ FFmpeg: Incorrect architecture or linking"
          exit 1
        fi
        
        if file ./output/ffprobe | grep -q "ARM.*statically linked"; then
          echo "✅ FFprobe: Correct ARM architecture and statically linked"
        else
          echo "❌ FFprobe: Incorrect architecture or linking"
          exit 1
        fi
        
        # Check binary sizes (should be reasonable for static builds)
        FFMPEG_SIZE=$(stat -c%s ./output/ffmpeg)
        FFPROBE_SIZE=$(stat -c%s ./output/ffprobe)
        
        echo "📊 FFmpeg size: ${FFMPEG_SIZE} bytes"
        echo "📊 FFprobe size: ${FFPROBE_SIZE} bytes"
        
        # Reasonable size check (minimal: 1-15MB, normal: 5-35MB, full: 15-60MB)
        case "${{ matrix.option }}" in
          "minimal")
            MIN_SIZE=1048576    # 1MB
            MAX_SIZE=15728640   # 15MB
            ;;
          "normal")
            MIN_SIZE=5242880    # 5MB
            MAX_SIZE=36700160   # 35MB
            ;;
          "full")
            MIN_SIZE=15728640   # 15MB
            MAX_SIZE=62914560   # 60MB
            ;;
        esac
        
        if [ $FFMPEG_SIZE -gt $MIN_SIZE ] && [ $FFMPEG_SIZE -lt $MAX_SIZE ]; then
          echo "✅ FFmpeg size is reasonable for ${{ matrix.option }} build"
        else
          echo "⚠️  FFmpeg size might be unexpected for ${{ matrix.option }} build: ${FFMPEG_SIZE} bytes"
        fi
        
        echo "🎉 All binary tests passed!"
        
    - name: 📦 Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ffmpeg-${{ matrix.option }}-armv6-binaries
        path: |
          ./output/ffmpeg
          ./output/ffprobe
        retention-days: 30
        
    - name: 📋 Build summary
      run: |
        echo "✅ Configuration: ${{ matrix.option }}"
        echo "✅ Target: ARMv6 (Raspberry Pi Zero compatible)"
        echo "✅ Architecture: $(file ./output/ffmpeg | grep -o 'ARM[^,]*')"
        echo "✅ Linking: Static (no external dependencies)"
        echo "✅ Size: FFmpeg $(ls -lh ./output/ffmpeg | awk '{print $5}'), FFprobe $(ls -lh ./output/ffprobe | awk '{print $5}')"
        echo "✅ Features: Based on ${{ matrix.option }} configuration"
        echo "🎉 Build completed successfully!" 